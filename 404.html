<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Redirecting to ismaelroblesrazzaq.github.io</title>
  <script>
    const targetBase = "https://ismaelroblesrazzaq.github.io";
    const targetUrl = `${targetBase}${window.location.pathname}${window.location.search}${window.location.hash}`;
    window.location.replace(targetUrl);
  </script>
</head>
<body>
  <p>
    This site moved to
    <a href="https://ismaelroblesrazzaq.github.io/">ismaelroblesrazzaq.github.io</a>.
  </p>
</body>
</html>
