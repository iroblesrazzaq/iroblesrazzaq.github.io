<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://ismaelroblesrazzaq.github.io/">
  <title>Redirecting to ismaelroblesrazzaq.github.io</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f4ed;
      color: #1d1d1b;
    }

    main {
      max-width: 640px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
      color: #4d4d48;
    }

    a {
      color: inherit;
    }
  </style>
  <script>
    const targetBase = "https://ismaelroblesrazzaq.github.io";
    const targetUrl = `${targetBase}${window.location.pathname}${window.location.search}${window.location.hash}`;
    window.location.replace(targetUrl);
  </script>
</head>
<body>
  <main>
    <h1>Redirecting</h1>
    <p>
      This site moved to
      <a href="https://ismaelroblesrazzaq.github.io/">ismaelroblesrazzaq.github.io</a>.
    </p>
  </main>
</body>
</html>
